name: Build and validate DevilMode plugin

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Devil Mode session state
    runs-on: ubuntu-24.04
    steps:
      - name: Check out plugin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run session state check
        run: php tests/session.php

  build:
    needs: test
    uses: AxolotlBucketLabs/DevTools/.github/workflows/build-plugin.yml@latest # v3.0.0
    with:
      axolotl-ref: e881fc1bc1c401545baf6bd1f824e41ff3f57bd1
      phpstan: max
